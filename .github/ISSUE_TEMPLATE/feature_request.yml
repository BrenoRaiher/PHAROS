name: Feature request
description: Propose a scoped PHAROS capability or improvement
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: need
    attributes:
      label: Scientific or user need
      description: Describe the problem and intended use, not only an implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Models, references, or validation criteria

